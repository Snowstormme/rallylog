{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="container narrow-page"><a class="back-link" href="{{ url_for('site.my_profile') }}">← YOUR DIARY</a><p class="eyebrow">ACCOUNT</p><h1>Your profile<span>.</span></h1><p class="muted">Choose how your name and story appear next to your public match reviews.</p><form method="post" class="settings-form stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Display name<input name="display_name" maxlength="60" value="{{ current_user.display_name }}" required></label><label>Bio<textarea name="bio" maxlength="280" rows="4" placeholder="A little about your tennis taste...">{{ current_user.bio }}</textarea></label><div class="form-divider"><h2>Change password</h2><p>Leave these blank to keep your current password.</p></div><label>Current password<input type="password" name="current_password" autocomplete="current-password"></label><label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="10"></label><button class="button" type="submit">Save settings ↗</button></form><form method="post" action="{{ url_for('site.logout') }}" class="logout-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="quiet-button" type="submit">Log out</button></form></div>
{% endblock %}
