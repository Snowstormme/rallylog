name: Import match history since 2010

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: First season to import
        required: true
        default: '2010'
      to_year:
        description: Last season to import
        required: true
        default: '2026'

permissions:
  contents: read

concurrency:
  group: tennis-history-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import ATP and WTA results
        env:
          DATABASE_URL: ${{ secrets.TENNISD_SYNC_DATABASE_URL }}
          AUTO_CREATE_DB: 'false'
        run: >-
          flask --app wsgi import-tennis
          --from-year "${{ inputs.from_year }}"
          --to-year "${{ inputs.to_year }}"
